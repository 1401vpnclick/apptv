plugins {
    id 'com.android.application'
}

def verProps = new Properties()
def verFile = rootProject.file('version.properties')
if (verFile.exists()) { verFile.withInputStream { verProps.load(it) } }

android {
    namespace 'com.checkapp.panel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.checkapp.panel'
        minSdk 21
        targetSdk 34
        versionCode (verProps.getProperty('VERSION_CODE', '1')).toInteger()
        versionName verProps.getProperty('VERSION_NAME', '1.0')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
